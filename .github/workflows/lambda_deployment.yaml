name: Deploy Telegram Bot to AWS Lambda

on:
  # workflow_dispatch:
  #   inputs:
  #     environment:
  #       description: "Target environment"
  #       type: choice
  #       options: [DEV, PROD]
  #       required: true
  push:
    branches:
      - develop   # deploy when pushing to develop branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Zip Lambda package
        run: |
          rm -f function.zip
          (cd dist && zip -r ../function.zip .)
          zip -r function.zip node_modules
        # run: |
        #   mkdir -p package
        #   cp dist/handler.js package/
        #   cp package.json package/
        #   cp -r node_modules package/
        #   cd package && zip -r ../function.zip .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1   # change if needed

      - name: Update AWS Lambda environment
        run: |
          aws lambda update-function-configuration \
            --function-name hero-book-dev-fa \
            --environment "Variables={
              NODE_ENV=dev,
              TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }},
              MONGO_CONNECTION_STRING=${{ secrets.MONGO_CONNECTION_STRING }},
              DB_NAME=${{ vars.DB_NAME }},
              DB_WODS_COLLECTION=${{ vars.DB_WODS_COLLECTION }},
              HERO_BOOK_ADMIN_GROUP=${{ vars.HERO_BOOK_ADMIN_GROUP }},
              DB_TG_BAN_COLLECTION=${{ vars.DB_TG_BAN_COLLECTION }},
              DB_UNIT_REQUESTS_COLLECTION=${{ vars.DB_UNIT_REQUESTS_COLLECTION }}
            }"

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name hero-book-dev-fa \
            --zip-file fileb://function.zip
